<section class="spread cover" id="cover"><div class="container">${meta('SC','海外 AI 虚拟社交体验','UX/UI Design Portfolio')}<div class="cover-copy"><div class="cover-name">SoulChat AI</div><h1 style="margin-top:19px">让陪伴<br>自然发生</h1><p class="english">DESIGN FOR A MORE HUMAN CONNECTION</p><p class="intro">从第一次相遇，到更长久的连接。<br>一个海外虚拟社交产品的体验设计。</p><a class="pill" href="#context">探索项目 <svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" aria-hidden="true"><path d="M10 2v15M5 12l5 5 5-5"/></svg></a></div></div><div class="cover-orb" aria-hidden="true"></div><div class="hero-position"><div class="hero-motion">${screen('welcome','','hardware hero-device')}</div></div><div class="cover-arrows" aria-hidden="true">${Array(3).fill('<svg viewBox="0 0 20 20"><path d="M16 3L4 15M4 5v10h10"/></svg>').join('')}</div><div class="hero-rock" aria-hidden="true">${img('basalt','','岩石承托场景')}</div><span class="cover-echo" aria-hidden="true">SoulChat AI</span><div class="cover-bottom"><div class="container"><span>本地化体验 / 交互效率 / 价值感知</span><span>Scroll to discover</span></div></div></section>

<section class="spread context" id="context"><div class="container">${meta('01','项目背景','Discover / Define')}${head('在产品成长阶段<br>如何进一步提升用户体验')}<div class="context-body"><div class="context-copy"><h3>我们设计的是怎样的产品</h3><p>SoulChat AI 面向海外用户，提供 AI 虚拟角色聊天、自定义形象装扮、互动直播与会员增值服务。业务希望提升新用户注册转化率、日均聊天时长和会员付费转化率，增强海外用户的产品留存。</p><h3>从进入产品到理解付费价值</h3><p>注册时填写的信息与步骤较多，个人中心的会员入口和账户信息不易查找，付费时又难以理解对应权益与套餐差异。这些阻力影响了用户开始体验、管理账户和完成购买的意愿。</p><h3>本次设计的核心挑战</h3><p>以注册登录、个人中心与付费购买页为重点，简化操作路径，明确界面层级，并为不同语言与本地使用习惯提供适配空间。</p><div class="scope-row"><span>新用户注册转化</span><span>日均聊天时长</span><span>会员付费转化</span></div></div><div class="context-graphic" aria-hidden="true"><div class="orbital-mark"></div><span class="big-word">Enter</span><span class="big-word">Explore</span><span class="big-word">Stay</span></div></div>${foot('本次重点：注册登录 · 个人中心 · 付费购买','体验目标：容易开始 / 查找清楚 / 理解价值')}</div></section>

<section class="spread insights" id="insights"><div class="container">${meta('02','用户洞察','User feedback / Design response')}${head('听见用户的阻力<br>找到设计的落点','围绕页面中的三类任务，建立问题与解决方案之间的对应关系。点击反馈，聚焦相关设计动作。')}<div class="insight-grid"><button class="insight-source" data-insight="0" aria-pressed="true"><span class="insight-avatar">A</span><div><h3>信息太多注册太复杂</h3><p>填了好几步，仍然没有进入体验。</p><span class="insight-task">注册登录</span></div></button><article class="insight-solution active" data-solution="0"><span class="solution-index">01 / START</span><h4>分步引导降低首次进入的负担</h4><p>启动、账号注册、登录与信息完善分别承担独立任务。每一步展示少量必要信息，个人中心前置 Apple 快捷登录入口。</p></article><button class="insight-source" data-insight="1" aria-pressed="false"><span class="insight-avatar">B</span><div><h3>会员入口为什么不好找</h3><p>权益状态与账户操作缺少清晰层级。</p><span class="insight-task">个人中心</span></div></button><article class="insight-solution" data-solution="1"><span class="solution-index">02 / FIND</span><h4>信息分层让账户管理一眼可读</h4><p>头像、昵称和 UID 集中展示；会员卡突出权益入口与状态；点数余额紧邻购买操作，常用登录方式保持直接可达。</p></article><button class="insight-source" data-insight="2" aria-pressed="false"><span class="insight-avatar">C</span><div><h3>付费之后能得到什么</h3><p>权益说不清，套餐也难以比较。</p><span class="insight-task">付费购买</span></div></button><article class="insight-solution" data-solution="2"><span class="solution-index">03 / CHOOSE</span><h4>权益前置让购买建立在理解之上</h4><p>先说明会员价值，再展示可对照的套餐。以粉色标签突出推荐选项，以金色线框标识选中状态，用橙粉渐变主按钮明确下一步。</p></article></div></div></section>

<section class="spread objectives" id="objectives"><div class="container">${meta('03','业务诉求与设计解决方案推导','Design strategy')}${head('用三条设计策略<br>回应产品成长目标','业务目标：新用户注册转化率提升 40%，用户日均聊天时长提升 30%，会员付费转化率提升 25%。')}<div class="objective-scene"><div class="objective-phone-space">${screen('discover','','hardware')}<div class="objective-floor">${img('basalt','','自然融入背景的岩石局部')}</div></div><div class="goal-list"><article class="goal"><span class="strategy-count">01</span><h3>交互逻辑本地化适配</h3><p>符合海外用户的纵向操作习惯，减少横向排列的功能按钮，降低误触概率。文本区域预留 20%–30% 的横向空间，适应多语言替换后字符变长的需求，避免文字溢出。</p></article><article class="goal"><span class="strategy-count">02</span><h3>操作路径极简优化</h3><p>注册、聊天、付费核心流程减少跳转步骤，每一步只展示用户需要的信息，降低操作成本和学习成本。</p></article><article class="goal"><span class="strategy-count">03</span><h3>视觉文化适配</h3><p>提前查询目标地区的颜色禁忌，采用高图版率、圆角与高呼吸感的设计风格，避免本地化的文化冲突。</p></article><div class="business-targets"><div><strong>+40<span>%</span></strong><small>注册转化目标</small></div><div><strong>+30<span>%</span></strong><small>日均聊天时长目标</small></div><div><strong>+25<span>%</span></strong><small>会员付费转化目标</small></div></div></div></div></div></section>

<section class="spread research" id="research"><div class="container">${meta('04','海外产品参考研究','Product references')}${head('海外产品参考研究','结合公开会员界面与官方说明，观察权益表达、套餐对照与订阅管理，将参考中的设计判断转化为 SoulChat AI 的界面方案。')}<div class="reference-tabs seg" role="group" aria-label="聚焦竞品会员资料"><button data-reference-app="all" aria-pressed="true">整体对照</button><button data-reference-app="character" aria-pressed="false">Character.AI</button><button data-reference-app="replika" aria-pressed="false">Replika</button><button data-reference-app="talkie" aria-pressed="false">Talkie</button></div><div class="reference-gallery membership-references"><article class="reference-study" data-study="character"><div class="reference-number">01 <span>权益先于价格</span></div><div class="membership-art"><button class="membership-image zoom" data-key="character-member" data-title="Character.AI · 2023 官方会员界面" aria-label="放大 Character.AI 会员原图">${img('character-member','','Character.AI 官方发布的 c.ai+ 权益与订阅界面')}</button><span class="material-tag">官方界面原图 · 2023</span></div><div class="reference-caption"><h3>Character.AI <small>c.ai+</small></h3><p>会员页先以列表说明优先访问、响应速度等权益，再在底部放置月费与订阅按钮。用户先理解价值，再找到开通动作。</p><span>设计落点 · 权益列表前置，购买入口独立</span><a href="https://blog.character.ai/introducing-c-ai/" target="_blank" rel="noreferrer">官方发布来源 ↗</a></div></article><article class="reference-study" data-study="replika"><div class="reference-number">02 <span>方案并列对照</span></div><div class="membership-art"><button class="membership-image zoom" data-key="replika-member" data-title="Replika PRO · 2025 报告收录的订阅弹窗" aria-label="放大 Replika 订阅弹窗原图">${img('replika-member','','Replika PRO 订阅弹窗，包含会员说明、月度年度终身方案与购买按钮')}</button><span class="material-tag">真实界面截图 · 2025 报告收录</span></div><div class="reference-caption"><h3>Replika <small>PRO</small></h3><p>订阅弹窗将会员说明、三种周期与购买操作放在同一视野中，年付方案用线框和优惠标签标识。比较时应同时读清折算价格与扣费周期。</p><span>设计落点 · 套餐可比较，选中状态明确</span><a href="https://techjusticelaw.org/wp-content/uploads/2025/01/Complaint-and-Petition-for-Investigation-Re-Replika.pdf#page=64" target="_blank" rel="noreferrer">截图来源 · 第 64 页 ↗</a></div></article><article class="reference-study" data-study="talkie"><div class="reference-number">03 <span>状态与周期清楚</span></div><div class="membership-art"><div class="talkie-membership-map" role="img" aria-label="依据 Talkie 官方会员问答整理的订阅结构，包含跨端会员状态、月季年付周期和订阅管理"><div class="membership-map-heading"><strong>Talkie<span>+</span></strong><small>官方会员资料整理</small></div><div class="membership-map-row"><span>会员状态</span><div class="membership-platforms"><b>Web</b><i>↔</i><b>App</b></div><p>会员状态跨端适用<br>具体权益可能存在差异</p></div><div class="membership-map-row"><span>付款周期</span><div class="membership-periods"><b>月付</b><b>季付</b><b>年付</b></div><p>可切换周期，年付提供优惠</p></div><div class="membership-manage"><span>订阅管理</span><strong>Manage Billing ↗</strong><p>提供取消订阅的管理入口</p></div></div><span class="material-tag">信息结构整理图 · 非 App 截图</span></div><div class="reference-caption"><h3>Talkie <small>Talkie+</small></h3><p>官方问答分别解释跨端会员状态、付款周期切换与取消入口。这里将规则整理为结构图，用来检查权益说明和账户状态是否衔接完整。</p><span>设计落点 · 说明适用范围，保留管理入口</span><a href="https://www.talkie-ai.com/static/vip-faq" target="_blank" rel="noreferrer">官方会员问答 ↗</a></div></article></div><div class="research-transfer"><span>回到 SoulChat AI</span><p>个人中心先表达未开通与已开通状态；会员方案前置权益说明；套餐并列展示，用金色线框表达选中状态，让用户从发现入口到理解价值、选择方案形成连续的阅读路径。</p></div><p class="source-note">前两张为历史会员界面，用于观察信息层级，图中价格与权益不代表当前版本。Talkie 为依据官方问答制作的信息整理图；以上不推断竞品转化效果。</p></div></section>

  <section class="spread profile-states" id="profile-states"><div class="container">${meta('05','个人中心 · 状态展示','Discover / Activate / Member')}${head('从发现会员<br>到理解方案与查看权益','以未开通入口、会员方案和已开通状态串联同一条会员路径。每张界面对应不同阶段，保持清楚的关联。')}<div class="profile-controls"><div class="seg" role="group" aria-label="聚焦账户任务"><button data-profile="profile" aria-pressed="true">未开通会员</button><button data-profile="subscription" aria-pressed="false">选择会员方案</button><button data-profile="paid" aria-pressed="false">已开通会员</button></div><div class="profile-stat">会员入口点击率相对提升 <b>+38.2%</b></div></div><div class="triple-stage">${screen('profile','未开通 · 权益入口','hardware account-state active')}${screen('subscription','开通中 · 方案选择','hardware account-state')}${screen('paid','已开通 · 权益状态','hardware account-state')}</div><div class="profile-explanation"><span></span><p id="profile-explanation">未开通状态突出会员入口与价值说明，方便用户发现权益。</p><span></span></div>${foot('12.7% → 17.5% · 个人中心会员入口点击率','数据来源：项目整理稿')}</div></section>

<section class="spread account-detail" id="account-detail"><div class="container">${meta('06','个人中心 · 信息分层','Design anatomy')}${head('信息分层展示<br>提升账号管理效率','用户在个人中心找不到会员开通入口，登录需要跳转多个页面。通过权益分层、快捷操作前置与高对比度视觉引导，减少查找成本。')}<div class="specimen-stage"><div class="specimen-notes left"><article class="specimen-note"><span class="note-index">01 / MEMBERSHIP</span><h3>权益信息分层展示</h3>${crop('paid',375,812,17,172,340,154,'个人中心 · 已开通会员权益卡','exact-membership-card')}<p>已开通会员卡集中呈现 PRO 标识、会员赠送点数与有效期。权益卡与账户点数余额分层展示，用户进入页面即可了解当前状态。</p></article><article class="specimen-note"><span class="note-index">02 / IDENTITY</span><h3>身份信息集中展示</h3><p>头像、昵称和 UID 归在同一个区域，账户身份与权益信息各有明确层级。</p></article></div><div class="annotated-account">${annotated('paid','个人中心 · 已开通会员的信息分层',[{x:17,y:205,w:340,h:121,n:1},{x:18,y:95,w:225,h:90,n:2},{x:18,y:340,w:339,h:96,n:3},{x:102,y:623,w:178,h:74,n:4}])}</div><div class="specimen-notes right"><article class="specimen-note"><span class="note-index">03 / COINS</span><h3>余额与购买紧密相邻</h3><p>点数余额和购买入口归为一组，信息与操作相互对应，减少查找与记忆负担。</p></article><article class="specimen-note"><span class="note-index">04 / SIGN IN</span><h3>快捷操作前置</h3>${crop('paid',375,812,102,623,178,74,'个人中心 · 用户名和 Apple 快捷登录','exact-signin')}<p>常用登录方式前置，用户可以直接完成登录，缩短操作路径。高饱和色操作入口帮助用户快速辨认。</p></article></div></div><div class="account-evidence"><span>个人中心会员入口点击率<small>优化前后对照</small></span><div><b>12.7<span>%</span></b><i aria-hidden="true">→</i><b class="pink">17.5<span>%</span></b></div></div></div></section>

<section class="spread purchase" id="purchase"><div class="container">${meta('07','付费购买页','Benefits / Choice / Action')}${head('权益清晰展示<br>最优选项引导付费转化','用户付费时不知道对应可以获得什么权益，套餐选项太多、决策成本高，容易放弃付费。将价值说明、推荐选项和购买动作整合在一条清晰的决策路径中。')}<div class="purchase-layout"><div class="purchase-art"><div class="purchase-orbit" aria-hidden="true"></div><div class="purchase-device purchase-points">${annotated('points','点数购买',[{x:18,y:474,w:108,h:80,n:2},{x:29,y:607,w:315,h:50,n:3}])}<span class="purchase-caption">点数购买</span></div><div class="purchase-device purchase-subscription">${annotated('subscription','会员订阅',[{x:70,y:278,w:260,h:100,n:1},{x:24,y:653,w:327,h:50,n:3}])}<span class="purchase-caption">会员订阅</span></div></div><div class="purchase-analysis"><button class="analysis-row active" data-purchase="0" aria-pressed="true"><span class="analysis-number">01</span><div><h3>权益前置说明设计</h3><p>付费弹窗顶部清晰列出所有会员权益内容。用户可以直观了解付费获得的价值，不需要跳转帮助页面查看说明，降低理解成本。</p></div></button><button class="analysis-row" data-purchase="1" aria-pressed="false"><span class="analysis-number">02</span><div><h3>高性价比选项高亮设计</h3><p>以粉色标签突出最受欢迎的套餐，并用金色线框表示选中状态，引导用户选择，降低决策成本，缩短决策时间。</p></div></button><button class="analysis-row" data-purchase="2" aria-pressed="false"><span class="analysis-number">03</span><div><h3>操作按钮强突出设计</h3><p>底部购买按钮使用高饱和度橙粉渐变，视觉优先级高。用户完成套餐选择后可以快速点击购买，操作路径清晰无干扰。</p></div></button><div class="purchase-selection"><div class="selection-heading"><span>套餐选择 · 交互示意</span><span id="selection-current">45,000 点数</span></div><div class="plan-controls" role="group" aria-label="选择示意套餐"><button class="plan" data-plan="0" aria-pressed="false"><strong>4,500</strong><small>$9.99</small></button><button class="plan" data-plan="1" aria-pressed="true"><span class="popular-label">Most Popular</span><strong>45,000</strong><small>$99.99</small></button><button class="plan" data-plan="2" aria-pressed="false"><strong>90,000</strong><small>$199.99</small></button></div><div class="purchase-action-preview">Buy Now <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h14M11 4l6 6-6 6"/></svg></div><p class="selection-note" id="plan-result" aria-live="polite">已选 45,000 点数 / $99.99 · 点击套餐查看选中状态</p></div></div></div><div class="chapter-evidence purchase-evidence"><div><span>数据反馈</span><h3>会员付费转化率提升 <b>28.9%</b></h3><p>统计付费弹窗曝光到用户完成付费的比例，数据来自业务记录。</p></div><div class="evidence-change"><span><strong>3.8<small>%</small></strong><em>优化前</em></span><div class="evidence-connector" aria-hidden="true"></div><span><strong>4.9<small>%</small></strong><em>优化后</em></span></div></div></div></section>

<section class="spread onboarding" id="onboarding"><div class="container">${meta('08','注册登录流程页','Step by step / Multilingual')}${head('分步引导与多语言适配<br>提升新用户注册转化','海外用户觉得填写信息步骤繁琐；部分语言字符较长，容易出现文字溢出，影响阅读体验，导致注册中途放弃。')}<div class="onboarding-stage"><div class="onboard-item">${screen('welcome','启动页','hardware')}<span class="onboard-step">01 / 建立兴趣</span></div><div class="onboard-item">${screen('register','账号注册','hardware')}<span class="onboard-step">02 / 必要输入</span></div><div class="onboard-item">${screen('login','登录','hardware')}<span class="onboard-step">03 / 直接进入</span></div><div class="onboard-item">${screen('information','信息完善','hardware')}<span class="onboard-step">04 / 资料维护</span></div><div class="registration-thread" aria-hidden="true"><svg viewBox="0 0 1200 100" preserveAspectRatio="none"><path d="M0 70C200 90 250 20 400 48S700 90 800 32S1060 14 1200 45"/></svg></div></div><div class="registration-analysis registration-open"><article class="registration-principle"><div class="principle-top"><span>01</span><small>分步引导</small></div><h3>一次只完成一个任务</h3><p>将注册流程拆分为启动页、账号注册、登录、信息完善四个独立步骤。每一步只展示少量需要填写的信息，降低用户的心理负担，减少注册中途的用户流失。</p><div class="principle-support"><div class="registration-flow"><span>启动页</span><i>→</i><span>注册 / 登录</span><i>→</i><span>信息完善</span></div></div></article><article class="registration-principle"><div class="principle-top"><span>02</span><small>多语言适配</small></div><h3>留出空间让译文自然展开</h3><p>文本区域与按钮预留约 30% 横向余量，适应替换成长字符语言的需求。保留折行与自适应高度，并用实际译文检查，减少不同语言单独调整布局的成本。</p><div class="principle-support"><div class="language-reserve"><strong>30<small>%</small></strong><span>横向预留余量</span><div class="reserve-track"><i></i><b>30%</b></div></div></div></article><article class="registration-principle"><div class="principle-top"><span>03</span><small>快捷登录</small></div><h3>熟悉的入口更快地开始</h3><p>个人中心前置海外用户常用的 Apple 快捷登录入口，减少手动输入账号密码。项目整理稿记录注册操作效率提升 50% 以上。</p><div class="principle-support"><div class="signin-efficiency"><strong>50%+</strong><span>操作效率提升</span></div><div class="signin-way-comparison" aria-label="账号密码与 Apple 快捷登录方式对照"><figure><figcaption>账号密码登录</figcaption><div class="signin-way-image">${crop('login',375,812,39,293,296,119,'账号密码登录 · 输入区域','login-input-crop')}</div><p>手动填写用户名与密码</p></figure><figure><figcaption>Apple 快捷登录</figcaption><div class="signin-way-image">${crop('paid',375,812,102,668,178,27,'Apple 快捷登录入口','registration-apple')}</div><p>通过 Apple 账号授权进入</p></figure></div></div></article></div><div class="chapter-evidence registration-evidence"><div><span>数据反馈</span><h3>新用户注册转化率提升 <b>42.7%</b></h3><p>统计从启动页访问到完成注册的用户比例，数据来自用户操作埋点。</p></div><div class="evidence-change"><span><strong>28.4<small>%</small></strong><em>优化前</em></span><div class="evidence-connector" aria-hidden="true"></div><span><strong>40.5<small>%</small></strong><em>优化后</em></span></div></div></div></section>

<section class="spread localization" id="localization"><div class="container">${meta('09','海外字符与排版','Typography / Real evidence')}${head('读懂字形与语言<br>再决定界面的留白','依据 W3C 国际化资料，分别检查翻译长度、连接字形、阅读方向与断行方式。视觉密度取决于具体字体、字号和内容，使用真实文本实测。')}<div class="type-reference-board"><aside class="type-reference-intro"><span>01 / SCRIPT</span><h3>字符形态</h3><p>字母宽度、连接形态与音节结构，会改变同一字号下的视觉密度。留白应依据字体与实际内容检查。</p><p>拉丁文字在词间留有空格；阿拉伯语保留连接字形与阅读方向；韩文以音节块构成文字。</p><small>点击语言行，查看下方的实际排版。</small></aside><div class="script-gallery"><button class="script-study active" data-language="en" aria-pressed="true"><span class="script-meta">英语 · Manrope</span><span class="script-example" lang="en">Input processing features</span><span class="script-observation">拉丁字母宽度不一，普通英文短语可在单词间折行。</span></button><button class="script-study" data-language="de" aria-pressed="false"><span class="script-meta">德语 · Manrope</span><span class="script-example" lang="de">Eingabeverarbeitungsfunktionen</span><span class="script-observation">复合词可能比对应英文短语更长，需要断词或溢出后的折行策略。</span></button><button class="script-study" data-language="ar" aria-pressed="false"><span class="script-meta">阿拉伯语 · Noto Sans Arabic</span><span class="script-example" lang="ar" dir="rtl">مدخل إلى <bdi dir="ltr">C++</bdi></span><span class="script-observation">字母按上下文连接变形；正文从右向左，拉丁字母与数字保留自身方向。</span></button><button class="script-study" data-language="ko" aria-pressed="false"><span class="script-meta">韩语 · Noto Sans KR</span><span class="script-example" lang="ko">한국어 텍스트 레이아웃</span><span class="script-observation">韩文以音节块组织字形；可以按字或按词断行，需要明确选择。</span></button></div></div><div class="adaptation-board"><div class="adaptation-diagrams"><div class="adaptation-pair"><div class="layout-mini before wrap"><i></i><b></b><em></em><em></em></div><span class="diagram-arrow">↓</span><div class="layout-mini after wrap"><i></i><b></b><em></em><em></em></div><small>折行适配</small></div><div class="adaptation-pair"><div class="layout-mini before truncate"><i></i><b></b><em></em><em></em></div><span class="diagram-arrow">↓</span><div class="layout-mini after truncate"><i></i><b></b><em></em><em></em></div><small>省略适配</small></div><div class="adaptation-pair"><div class="layout-mini before stack"><i></i><b></b><em></em><em></em></div><span class="diagram-arrow">↓</span><div class="layout-mini after stack"><i></i><b></b><em></em><em></em></div><small>独立排列</small></div></div><div class="adaptation-notes"><article><h3>折行适配</h3><p>正文与重要说明保留完整内容，允许换行与容器增高。德语复合词结合语言断词规则，窄屏再提供溢出折行。</p></article><article><h3>省略适配</h3><p>仅对列表预览等次要内容使用省略，并提供查看全文的入口。权益、价格与主按钮不得截断关键信息。</p></article><article><h3>独立排列</h3><p>长标签与多项信息拆为独立行，减少横向挤压。RTL 场景按阅读方向组织，数字与拉丁片段保持自身方向。</p></article></div></div><div class="type-lab"><div class="type-rule"><h3 id="type-rule-title">长度会变容器也要能伸缩</h3><p id="type-rule-body">W3C 建议允许文字重排，避免过紧的固定宽度容器。短标签的译文也可能大幅变长，不能依赖统一百分比保证适配。</p><div class="joining-example" id="joining-example" hidden><span lang="ar">م</span><span lang="ar">م‍</span><span lang="ar">‍م‍</span><span lang="ar">‍م</span><small>同一个字母 م 的独立、词首、词中、词尾形态</small></div><div class="seg" id="korean-break-controls" role="group" aria-label="韩语断行方式" hidden><button data-break="keep-all" aria-pressed="true">按词断行</button><button data-break="normal" aria-pressed="false">按字断行</button></div><p class="type-project">在本项目中：文本区域预留 20%–30% 横向空间，同时保留折行、弹性高度和真实译文检查。</p></div><div class="live-type"><label for="text-width">调整示例宽度 <span id="text-width-value">300 px</span></label><input id="text-width" type="range" min="185" max="340" value="300" step="1" aria-label="调整文本示意宽度"><div class="live-card" id="live-card" lang="en" dir="ltr"><div class="type-scale">Aa <span id="sample-font">Manrope / 22 px</span></div><h3 id="live-title">Input processing features</h3><p class="sample-description" id="live-description">English phrase from the W3C text expansion example.</p><span class="sample-baseline" aria-hidden="true"></span></div><p id="type-measurement" aria-live="polite">按实际渲染检查折行</p></div></div></div></section>

<section class="spread results" id="results"><div class="container">${meta('10','数据结果验证','Measure / Learn / Iterate')}${head('数据结果验证<br>校正设计方向')}<div class="results-sub italic">A clearer experience<br>A stronger connection</div><div class="results-controls"><div class="seg" role="group" aria-label="数据展示口径"><button data-result-view="uplift" aria-pressed="true">相对提升</button><button data-result-view="before" aria-pressed="false">优化前</button><button data-result-view="after" aria-pressed="false">优化后</button></div></div><div class="outcome-gallery">${[{title:'新用户注册转化率',uplift:'42.7',before:'28.4%',after:'40.5%',desc:'从启动页访问到完成注册',key:'registration',a:28.4,b:40.5,max:50},{title:'用户日均聊天时长',uplift:'36.2',before:'12.7 分钟',after:'17.3 分钟',desc:'用户在聊天页的日均停留时长',key:'engagement',a:12.7,b:17.3,max:22},{title:'会员付费转化率',uplift:'28.9',before:'3.8%',after:'4.9%',desc:'从付费弹窗曝光到完成付费',key:'conversion',a:3.8,b:4.9,max:6}].map((d,i)=>`<article class="outcome"><span class="outcome-index">0${i+1}</span><h3>${d.title}</h3><div class="outcome-number" data-result="${i}">+${d.uplift}<small>%</small></div><div class="outcome-chart" aria-label="优化前设为100，优化后为${100+Number(d.uplift)}"><svg viewBox="0 0 340 230" role="img"><title>同一相对标尺：100 对 ${100+Number(d.uplift)}</title><defs><linearGradient id="bar-${i}" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff91bb"/><stop offset="1" stop-color="#f12c75"/></linearGradient></defs><path class="relative-guide" d="M22 90H318"/><text class="relative-baseline" x="22" y="81">100</text><rect class="comparison-before" x="65" y="90" width="66" height="100" rx="7"/><rect class="comparison-after" x="207" y="${190-(100+Number(d.uplift))}" width="66" height="${100+Number(d.uplift)}" rx="7" fill="url(#bar-${i})"/><text class="relative-index" x="240" y="${178-(100+Number(d.uplift))}" text-anchor="middle">${100+Number(d.uplift)}</text></svg><div class="chart-labels"><span>${d.before}<small>优化前</small></span><span>${d.after}<small>优化后</small></span></div></div><p>${d.desc}</p></article>`).join('')}</div><div class="results-provenance"><span>优化前 = 100</span><p>三组柱形共用相对标尺，以各自优化前为 100；柱高对应实际相对增幅，不混用百分比与分钟。数据来自项目整理稿。注册率增加 12.1 个百分点，付费率增加 1.1 个百分点；以上为优化前后变化。</p></div></div></section>

<section class="spread methodology" id="methodology"><div class="container">${meta('11','复用经验与方法论','Experience into practice')}${head('把设计中的判断<br>沉淀为可复用的方法')}<div class="method-switch" role="group" aria-label="聚焦三条方法"><button data-method="0" aria-pressed="true">本地化</button><button data-method="1" aria-pressed="false">简化路径</button><button data-method="2" aria-pressed="false">说明价值</button></div><div class="method-list"><article class="method-entry focused" data-method-panel="0"><span class="method-ordinal">01</span><strong class="method-keyword">本地化</strong><span class="method-category">LOCAL HABITS / 本地习惯</span><div class="method-summary"><h3>优先适配本地用户的习惯</h3><p>海外产品设计需要优先适配本地用户的操作习惯，减少横向操作按钮的排布，预留足够的多语言适配空间，能有效降低用户的学习成本和使用障碍。</p></div></article><article class="method-entry" data-method-panel="1"><span class="method-ordinal">02</span><strong class="method-keyword">简化路径</strong><span class="method-category">CORE FLOW / 核心路径</span><div class="method-summary"><h3>简化社交产品的核心操作路径</h3><p>社交类产品的核心操作路径需要尽可能简化，减少不必要的跳转和信息输入，可以大幅提升用户的操作意愿和转化率。</p></div></article><article class="method-entry" data-method-panel="2"><span class="method-ordinal">03</span><strong class="method-keyword">看清价值</strong><span class="method-category">CLEAR VALUE / 付费价值</span><div class="method-summary"><h3>让付费价值清楚可见</h3><p>海外付费场景设计需要清晰展示对应的权益内容，突出高性价比选项，避免模糊的权益描述，能有效降低用户的决策成本，提升付费转化率。</p></div></article></div></div></section>

function hydrate(root=document){root.querySelectorAll('[data-image]').forEach(el=>{el.src=assets[el.dataset.image]});root.querySelectorAll('[data-background]').forEach(el=>el.style.backgroundImage=`url("${assets[el.dataset.background]}")`)}

const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fine=matchMedia('(hover: hover) and (pointer: fine)').matches;

const dialog=document.querySelector('#lightbox');let focusBefore=null;
function inspect(key,title){if(!assets[key])return;focusBefore=document.activeElement;const im=document.querySelector('#lightbox-image');im.src=assets[key];im.alt=title||keys[key];document.querySelector('#lightbox-title').textContent=title||keys[key];dialog.showModal();document.body.style.overflow='hidden';if(!reduced)dialog.animate([{opacity:0,transform:'scale(.96)'},{opacity:1,transform:'scale(1)'}],{duration:250,easing:'cubic-bezier(.23,1,.32,1)'})}
document.addEventListener('click',e=>{const b=e.target.closest('.zoom');if(b&&!document.querySelector('#wall-window').dataset.dragged)inspect(b.dataset.key,b.dataset.title)});
document.querySelector('#close-lightbox').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{document.body.style.overflow='';focusBefore?.focus({preventScroll:true})});dialog.addEventListener('click',e=>{const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()});
document.querySelectorAll('.menu-panel a').forEach(a=>a.addEventListener('click',()=>document.querySelector('.index-menu').open=false));
document.querySelectorAll('[data-insight]').forEach(b=>b.onclick=()=>{pressed('[data-insight]',b);document.querySelectorAll('[data-solution]').forEach(x=>x.classList.toggle('active',x.dataset.solution===b.dataset.insight))});
document.querySelectorAll('[data-reference-app]').forEach(b=>b.onclick=()=>{pressed('[data-reference-app]',b);document.querySelectorAll('[data-study]').forEach(x=>{const chosen=b.dataset.referenceApp==='all'||x.dataset.study===b.dataset.referenceApp;x.classList.toggle('subdued',!chosen);x.classList.toggle('focused',chosen&&b.dataset.referenceApp!=='all')})});

const scripts={en:{title:'Input processing features',desc:'English phrase from the W3C text expansion example.',font:'Manrope / 22 px',heading:'长度会变容器也要能伸缩',body:'W3C 建议允许文字重排，避免过紧的固定宽度容器。短标签的译文也可能大幅变长，不能依赖统一百分比保证适配。'},de:{title:'Eingabeverarbeitungsfunktionen',desc:'Das deutsche Beispiel für „Input processing features“ bei W3C.',font:'Manrope / 22 px',heading:'长复合词需要独立的断行策略',body:'W3C 用这一德语复合词说明：对应英文可以在词间折行，而德语可能没有现成的断点。本示例开启自动断词，并为极窄容器保留溢出后的折行。'},ar:{title:'مدخل إلى <bdi dir="ltr">C++</bdi>',desc:'مدخل إلى C++',font:'Noto Sans Arabic / 22 px',heading:'连接字形与双向文本需要一起处理',body:'阿拉伯语字母会随上下文形成不同连接形态，不能用拆散字母的排版模拟字距。正文采用从右向左的方向，混入的 C++ 用独立方向隔离。'},ko:{title:'한국어 텍스트 레이아웃',desc:'한국어 텍스트 레이아웃 및 타이포그래피를 위한 요구사항',font:'Noto Sans KR / 22 px',heading:'韩语断行可以按词也可以按字',body:'W3C 韩语排版资料说明可以选择音节或词语作为断行单位。本示例默认按词断行，并保留窄容器的溢出处理；可切换观察差异。'}};
const card=document.querySelector('#live-card'),sample=document.querySelector('#live-title');
function measureType(){const st=getComputedStyle(sample);const lines=Math.max(1,Math.round(sample.getBoundingClientRect().height/parseFloat(st.lineHeight)));document.querySelector('#type-measurement').textContent='当前实测：'+lines+' 行 · 容器 '+Math.round(card.getBoundingClientRect().width)+' px · 文字未裁切'}
document.querySelectorAll('[data-language]').forEach(b=>b.onclick=()=>{pressed('[data-language]',b);document.querySelectorAll('[data-language]').forEach(x=>x.classList.toggle('active',x===b));const code=b.dataset.language,d=scripts[code];card.lang=code;card.dir=code==='ar'?'rtl':'ltr';sample.innerHTML=d.title;document.querySelector('#live-description').innerHTML=code==='ar'?d.title:d.desc;document.querySelector('#sample-font').textContent=d.font;document.querySelector('#type-rule-title').textContent=d.heading;document.querySelector('#type-rule-body').textContent=d.body;document.querySelector('#joining-example').hidden=code!=='ar';document.querySelector('#korean-break-controls').hidden=code!=='ko';requestAnimationFrame(measureType)});
document.querySelectorAll('[data-break]').forEach(b=>b.onclick=()=>{pressed('[data-break]',b);sample.style.wordBreak=b.dataset.break;requestAnimationFrame(measureType)});
document.querySelector('#text-width').addEventListener('input',e=>{card.style.setProperty('--sample-width',e.target.value+'px');document.querySelector('#text-width-value').textContent=e.target.value+' px';requestAnimationFrame(measureType)});document.fonts.ready.then(measureType);
const resultValues={uplift:[['+42.7','%'],['+36.2','%'],['+28.9','%']],before:[['28.4','%'],['12.7','分钟'],['3.8','%']],after:[['40.5','%'],['17.3','分钟'],['4.9','%']]};
document.querySelectorAll('[data-result-view]').forEach(b=>b.onclick=()=>{pressed('[data-result-view]',b);document.querySelectorAll('[data-result]').forEach((el,i)=>{const v=resultValues[b.dataset.resultView][i];el.innerHTML=v[0]+'<small>'+v[1]+'</small>';if(!reduced)el.animate([{opacity:.6,transform:'translateY(5px)'},{opacity:1,transform:'translateY(0)'}],{duration:220,easing:'cubic-bezier(.23,1,.32,1)'})})});
const wall=document.querySelector('#wall-window');document.querySelector('#wall-prev').onclick=()=>wall.scrollBy({left:-330,behavior:reduced?'instant':'smooth'});document.querySelector('#wall-next').onclick=()=>wall.scrollBy({left:330,behavior:reduced?'instant':'smooth'});
let drag=null;if(fine){wall.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,start:wall.scrollLeft,id:e.pointerId};wall.dataset.dragged=''});wall.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>7){wall.dataset.dragged='true';wall.classList.add('dragging');wall.setPointerCapture(drag.id);wall.scrollLeft=drag.start-dx;e.preventDefault()}});function endDrag(){if(!drag)return;drag=null;wall.classList.remove('dragging');setTimeout(()=>delete wall.dataset.dragged,0)}wall.addEventListener('pointerup',endDrag);wall.addEventListener('pointercancel',endDrag);wall.addEventListener('lostpointercapture',endDrag)}wall.querySelectorAll('img').forEach(i=>i.draggable=false);wall.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){wall.scrollBy({left:e.key==='ArrowRight'?180:-180,behavior:'instant'});e.preventDefault()}});
const railIds=[...document.querySelectorAll('.spread')].map(x=>x.id);document.querySelector('.rail').innerHTML=railIds.map(id=>`<a href="#${id}" aria-label="跳至${document.querySelector('#'+id+' h2')?.textContent||'封面'}"></a>`).join('');const observer=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting)document.querySelectorAll('.rail a').forEach(a=>a.classList.toggle('current',a.hash==='#'+e.target.id))})},{rootMargin:'-15% 0px -65% 0px'});railIds.forEach(id=>observer.observe(document.querySelector('#'+id)));
let scheduled=false;const progress=document.querySelector('.page-progress'),wallSection=document.querySelector('#screen-wall'),columns=[...document.querySelectorAll('.wall-column')],heroMotion=document.querySelector('.hero-motion');function scrollFrame(){const max=document.documentElement.scrollHeight-innerHeight;progress.style.transform='scaleX('+(max>0?scrollY/max:0)+')';if(!reduced){const rect=wallSection.getBoundingClientRect();if(rect.top<innerHeight&&rect.bottom>0){const t=Math.min(1,Math.max(0,(innerHeight-rect.top)/(innerHeight+rect.height)));columns.forEach((c,i)=>c.style.transform='translateY('+((i%2?1:-1)*(t-.5)*75)+'px)')}if(scrollY<1100)heroMotion.style.transform='none'}scheduled=false}addEventListener('scroll',()=>{if(!scheduled){scheduled=true;requestAnimationFrame(scrollFrame)}},{passive:true});addEventListener('resize',()=>{scrollFrame();measureType()});scrollFrame();
if(fine&&!reduced){const hero=document.querySelector('.hero-device'),cover=document.querySelector('#cover');cover.addEventListener('pointermove',e=>{const r=cover.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;hero.style.transition='transform 180ms cubic-bezier(.23,1,.32,1)';hero.style.transform=`rotateY(${-7+x*2}deg) rotateX(${-y}deg) rotateZ(${3+x}deg)`});cover.addEventListener('pointerleave',()=>hero.style.transform='rotateY(-7deg) rotateZ(3deg)')}
