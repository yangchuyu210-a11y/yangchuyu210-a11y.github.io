const sections=[...document.querySelectorAll('[data-group]')],originalCards=[...document.querySelectorAll('[data-gallery]')],overviewGrid=document.getElementById('overview-grid');

originalCards.forEach(card=>{const clone=card.cloneNode(true);clone.removeAttribute('data-gallery');clone.dataset.overview='true';overviewGrid.append(clone);});

let category='all',view='exhibition',visibleWorks=works.slice(),current=0,opener=null;

function updateView(announce=true){document.getElementById('exhibition').classList.toggle('filtered',category!=='all');visibleWorks=works.filter(work=>category==='all'||work.group===category);sections.forEach(section=>section.hidden=category!=='all'&&section.dataset.group!==category);overviewGrid.querySelectorAll('.piece').forEach(piece=>piece.hidden=category!=='all'&&piece.dataset.category!==category);document.getElementById('exhibition').hidden=view!=='exhibition';document.getElementById('overview').hidden=view!=='overview';document.getElementById('overview-count').textContent=visibleWorks.length+' 件作品';document.querySelectorAll('[data-filter]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.filter===category)));document.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===view)));if(announce)document.getElementById('status').textContent='正在以'+(view==='exhibition'?'精选':'总览')+'方式展示 '+visibleWorks.length+' 张作品。';}

function revealBrowse(){const top=document.getElementById('browse').getBoundingClientRect().top+window.scrollY;if(window.scrollY>top||window.scrollY<top-15)window.scrollTo({top,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});}

document.querySelectorAll('[data-filter]').forEach(button=>button.addEventListener('click',()=>{category=button.dataset.filter;updateView();revealBrowse();}));document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{view=button.dataset.view;updateView();revealBrowse();}));

updateView(false);

// Match the personal portfolio's gentle, one-time scroll reveal.

const motionPreference=matchMedia('(prefers-reduced-motion: reduce)');

if('IntersectionObserver' in window&&!motionPreference.matches){

 const cards=[...document.querySelectorAll('.piece')];

 const revealObserver=new IntersectionObserver(entries=>{

  entries.forEach(entry=>{

   if(!entry.isIntersecting)return;

   const card=entry.target;

   revealObserver.unobserve(card);

   // Reveal the layout independently of image download or decoding.



   card.classList.add('is-visible');

  });

 },{threshold:0.1,rootMargin:'0px 0px -8% 0px'});

 cards.forEach(card=>{card.classList.add('reveal-ready');revealObserver.observe(card);});

 motionPreference.addEventListener('change',event=>{

  if(event.matches){revealObserver.disconnect();cards.forEach(card=>card.classList.add('is-visible'));}

 });

}
